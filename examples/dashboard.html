<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NVIDIA VSR dashboard preview</title>
    <style>
      body {
        margin: 0;
        background: #e9edf3;
        color: #616a78;
        font:
          12px/1.5 system-ui,
          sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      .preview {
        margin: 28px 0;
      }
      iframe {
        display: block;
        border: 1px solid #d8dee8;
        border-radius: 10px;
        width: 400px;
        height: 615px;
        max-width: calc(100vw - 26px);
        box-shadow: 0 12px 40px #182a4412;
        background: #f7f8fa;
      }
      p {
        text-align: center;
        margin: 0 12px 16px;
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <p>Extension dashboard · interactive preview</p>
      <iframe
        src="../extension/popup.html?preview=1"
        title="NVIDIA VSR extension dashboard preview with simulated controls and metrics"
      ></iframe>
    </div>
  </body>
</html>
